<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣百年時空地圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; }
        
        .leaflet-bottom.leaflet-right .leaflet-custom-history-control {
            margin-right: 10px;
            margin-bottom: 10px;
            pointer-events: auto; 
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(229, 231, 235, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 320px; 
            z-index: 1001; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .leaflet-custom-history-control .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .leaflet-custom-history-control h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
        }

        .leaflet-custom-history-control select, 
        .leaflet-custom-history-control input {
            font-size: 0.9rem;
            width: 100%;
        }

        .leaflet-custom-history-control .attribution {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            line-height: 1.4;
        }

        .leaflet-sbs-divider { z-index: 1002 !important; }
        .leaflet-sbs-range { z-index: 1003 !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side/leaflet-side-by-side.min.js"></script>

    <script>
        // 初始化地圖，預設中心點為嘉義車站
        const map = L.map('map').setView([23.4791, 120.4415], 14);

        // 加入現代地圖 (右側)
        const modernMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 初始化加入第一張歷史地圖 (左側)
        const historicalMap = L.tileLayer('https://gis.sinica.edu.tw/tileserver/file-exists.php?img=JM20K_1904-png-{z}-{x}-{y}', {
            maxZoom: 19,
            attribution: '© 中央研究院人社中心GIS專題中心'
        }).addTo(map);

        // 啟用拉桿 
        L.control.sideBySide(historicalMap, modernMap).addTo(map);

        // 動態切換圖層 API
        function changeHistoricalMap(selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const layerId = selectedOption.value;
            const serverType = selectedOption.getAttribute('data-server'); 
            
            let newUrl = '';
            
            // 判斷是否為嘉義市政府 WMTS 伺服器
            if (serverType === 'chiayi_gov_wmts') {
                // 將 Leaflet 預設的 {z}, {x}, {y} 轉換為 WMTS 的 TILEMATRIX, TILECOL, TILEROW 參數
                newUrl = `https://3dmap.chiayi.gov.tw/wmts/?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layerId}&STYLE=default&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png`;
            } else {
                // 維持原有中研院 API 格式
                newUrl = `https://gis.sinica.edu.tw/${serverType}/file-exists.php?img=${layerId}-png-{z}-{x}-{y}`;
            }
            
            historicalMap.setUrl(newUrl);
        }

        let currentMarker = null;
        async function searchAddress(addressInput) {
            const address = addressInput.value;
            if (!address) return;
            const query = `台灣 ${address}`;
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.flyTo([lat, lon], 16, { duration: 1.5 });
                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }
                    currentMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${address}</b><br>穿越到這裡！`)
                        .openPopup();
                } else {
                    alert('找不到這個地址，請換個關鍵字試試看！');
                }
            } catch (error) {
                alert('搜尋發生錯誤，請稍後再試。');
            }
        }

        L.Control.CustomHistory = L.Control.extend({
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-custom-history-control');
                L.DomEvent.disableClickPropagation(container);

                const titleContainer = L.DomUtil.create('div', 'title-container', container);
                const icon = L.DomUtil.create('span', '', titleContainer);
                icon.innerHTML = '🕰️';
                const title = L.DomUtil.create('h1', '', titleContainer);
                title.innerHTML = '台灣百年時空地圖';

                const select = L.DomUtil.create('select', 'w-full px-3 py-2 border border-gray-300 rounded-lg cursor-pointer', container);
                select.innerHTML = `
                    <optgroup label="全台灣">
                        <option value="JM20K_1904" data-server="tileserver">1904年 臺灣堡圖</option>
                        <option value="JM50K_1916" data-server="tileserver">1916年 日治五萬分之一地形圖</option>
                        <option value="JM25K_1921" data-server="tileserver">1921年 日治二萬五千分之一地形圖</option>
                        <option value="AM50K_1944" data-server="tileserver">1944年 美軍臺灣地形圖</option>
                        <option value="TM25K_1989" data-server="tileserver">1989年 經建版地形圖</option>
                        <option value="TM25K_2003" data-server="tileserver">2003年 經建版地形圖</option>
                    </optgroup>
                    <optgroup label="嘉義專屬特輯">
                        <option value="Chiayi_3K_1910s" data-server="chiayi">1910年代 嘉義市街平面圖</option>
                        <option value="chiayi_1935" data-server="chiayi">1935年 嘉義市街圖</option>
                        <option value="chiayi_1943" data-server="chiayi">1943年 嘉義都市計畫平面圖</option>
                        <option value="Chiayi_aerialphoto_1945" data-server="chiayi">1945年 嘉義市舊航照空拍影像</option>
                    </optgroup>
                    <optgroup label="嘉義市政府 3D 圖資 WMTS">
                        <!-- 需將 value 的值替換為從政府 GetCapabilities 中查到的真實 Layer ID -->
                        <option value="請填寫嘉義市政府的真實圖層代碼" data-server="chiayi_gov_wmts">匯入市府 WMTS 圖層 (需替換代碼)</option>
                    </optgroup>
                `;
                L.DomEvent.on(select, 'change', () => changeHistoricalMap(select));

                const searchRow = L.DomUtil.create('div', 'flex gap-2', container);
                const input = L.DomUtil.create('input', 'flex-1 px-4 py-2 border border-gray-300 rounded-lg', searchRow);
                input.placeholder = '輸入地址或地標 (例: 嘉義火車站)';
                const button = L.DomUtil.create('button', 'bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium', searchRow);
                button.innerHTML = '穿越';
                L.DomEvent.on(button, 'click', () => searchAddress(input));
                L.DomEvent.on(input, 'keypress', (e) => {
                    if (e.key === 'Enter') searchAddress(input);
                });

                const attribution = L.DomUtil.create('p', 'attribution', container);
                attribution.innerHTML = '左側：歷史地圖 | 右側：現代地圖<br>(拖曳中間拉桿進行比對)';

                return container;
            }
        });

        map.addControl(new L.Control.CustomHistory({ position: 'bottomright' }));
    </script>
</body>
</html>
