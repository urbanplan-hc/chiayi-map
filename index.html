<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉義古今地圖穿越</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; }
        
        /* 解決拉桿擋住面板的終極方案 */
        /* 1. 降低拉桿透明滑動層的層級 */
        .leaflet-sbs-range { z-index: 400 !important; }
        .leaflet-sbs-divider { z-index: 401 !important; }
        /* 2. 強制將 Leaflet 右下角控制區塊提至最上層 */
        .leaflet-control-container .leaflet-bottom.leaflet-right { z-index: 9999 !important; }

        .leaflet-custom-history-control {
            margin-right: 10px;
            margin-bottom: 20px;
            pointer-events: auto; 
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(229, 231, 235, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 320px; 
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .leaflet-custom-history-control select, 
        .leaflet-custom-history-control input {
            font-size: 0.9rem;
            width: 100%;
        }

        .leaflet-custom-history-control .attribution {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side/leaflet-side-by-side.min.js"></script>

    <script>
        // 初始化地圖，預設中心點為嘉義車站
        const map = L.map('map').setView([23.4791, 120.4415], 14);

        // 加入現代地圖 (右側)
        const modernMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 【修正3 & 1】左側歷史地圖預先載入 1904年 台灣堡圖，並改用 WMTS 標準格式避免圖磚破裂
        const initialLayerId = 'JM20K_1904';
        const historicalUrl = `https://gis.sinica.edu.tw/tileserver/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${initialLayerId}&STYLE=default&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg`;
        
        const historicalMap = L.tileLayer(historicalUrl, {
            maxZoom: 19,
            attribution: '© 中央研究院人社中心GIS專題中心'
        }).addTo(map);

        // 啟用拉桿 
        L.control.sideBySide(historicalMap, modernMap).addTo(map);

        // 動態切換圖層 API
        function changeHistoricalMap(selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const layerId = selectedOption.value;
            const serverType = selectedOption.getAttribute('data-server'); 
            
            let newUrl = '';
            if (serverType === 'tileserver') {
                // 【修正1】全台灣圖層改用 WMTS 請求
                newUrl = `https://gis.sinica.edu.tw/tileserver/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layerId}&STYLE=default&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg`;
            } else {
                // 嘉義特輯維持原有 API 格式
                newUrl = `https://gis.sinica.edu.tw/${serverType}/file-exists.php?img=${layerId}-png-{z}-{x}-{y}`;
            }
            
            historicalMap.setUrl(newUrl);
        }

        // 【修正4】改用 Google Maps API 搜尋地址
        let currentMarker = null;
        async function searchAddress(addressInput) {
            const address = addressInput.value;
            if (!address) return;

            // ⚠️ 填入你的 Google Maps API Key
            const GOOGLE_API_KEY = '請填寫你的_GOOGLE_MAPS_API_KEY';
            
            const query = `台灣 ${address}`;
            const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(query)}&key=${GOOGLE_API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'OK' && data.results.length > 0) {
                    const lat = data.results[0].geometry.location.lat;
                    const lon = data.results[0].geometry.location.lng;
                    
                    map.flyTo([lat, lon], 16, { duration: 1.5 });

                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }
                    
                    currentMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${address}</b><br>穿越到這裡！`)
                        .openPopup();
                } else {
                    alert('找不到這個地址，請確認關鍵字或檢查 API Key 是否有正確綁定！');
                }
            } catch (error) {
                alert('搜尋發生錯誤，請稍後再試。');
                console.error(error);
            }
        }

        L.Control.CustomHistory = L.Control.extend({
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-custom-history-control');
                L.DomEvent.disableClickPropagation(container);

                // 標題列 (包含收合按鈕)
                const header = L.DomUtil.create('div', 'flex justify-between items-center cursor-pointer', container);
                
                const titleContainer = L.DomUtil.create('div', 'flex items-center gap-2', header);
                const icon = L.DomUtil.create('span', '', titleContainer);
                icon.innerHTML = '🕰️';
                
                const title = L.DomUtil.create('h1', 'text-[1.1rem] font-bold text-gray-800 m-0', titleContainer);
                title.innerHTML = '嘉義古今地圖穿越';

                const toggleBtn = L.DomUtil.create('button', 'text-gray-500 hover:text-gray-800 focus:outline-none text-2xl leading-none font-medium', header);
                toggleBtn.innerHTML = '−';

                // 內容區塊
                const contentWrapper = L.DomUtil.create('div', 'flex flex-col gap-3 mt-4', container);

                const select = L.DomUtil.create('select', 'w-full px-3 py-2 border border-gray-300 rounded-lg cursor-pointer', contentWrapper);
                select.innerHTML = `
                    <optgroup label="全台灣">
                        <!-- 預設選中 1904 台灣堡圖 -->
                        <option value="JM20K_1904" data-server="tileserver" selected>1904年 臺灣堡圖</option>
                        <option value="JM50K_1916" data-server="tileserver">1916年 日治五萬分之一地形圖</option>
                        <option value="JM25K_1921" data-server="tileserver">1921年 日治二萬五千分之一地形圖</option>
                        <option value="AM50K_1944" data-server="tileserver">1944年 美軍臺灣地形圖</option>
                        <option value="TM25K_1989" data-server="tileserver">1989年 經建版地形圖</option>
                        <option value="TM25K_2003" data-server="tileserver">2003年 經建版地形圖</option>
                    </optgroup>
                    <optgroup label="嘉義專屬特輯">
                        <option value="chiayi_1895" data-server="chiayi">1895年 嘉義之戰鬥圖</option>
                        <option value="Chiayi_0.6K_1906A" data-server="chiayi">1906年 嘉義城內圖</option>
                        <option value="Chiayi_0.6K_1906B" data-server="chiayi">1906年 嘉義城外圖</option>
                        <option value="chiayi_1909" data-server="chiayi">1909年 嘉義市區改正圖</option>
                        <option value="Chiayi_3K_1910s" data-server="chiayi">1910年代 嘉義市街平面圖</option>
                        <option value="Chiayi_3K_1913" data-server="chiayi">1913年 嘉義市街圖</option>
                        <option value="chiayi_1931" data-server="chiayi">1931年 嘉義市街實測圖</option>
                        <option value="chiayi_1932" data-server="chiayi">1932年 嘉義市區計畫平面圖</option>
                        <option value="Chiayi_6K_1933" data-server="chiayi">1933年 嘉義市區計畫平面圖</option>
                        <option value="chiayi_1935" data-server="chiayi">1935年 嘉義市街圖</option>
                        <option value="chiayi_1936" data-server="chiayi">1936年 嘉義市職業別明細圖</option>
                        <option value="Chiayi_6K_1938" data-server="chiayi">1938年 嘉義都市計劃平面圖</option>
                        <option value="chiayi_12K_1940" data-server="chiayi">1940年 嘉義市內地圖</option>
                        <option value="chiayi_1943" data-server="chiayi">1943年 嘉義都市計畫平面圖</option>
                        <option value="AMCityPlan_1945" data-server="chiayi">1945年 美軍繪製臺灣城市地圖</option>
                        <option value="Chiayi_aerialphoto_1945" data-server="chiayi">1945年 嘉義市舊航照空拍影像</option>
                        <option value="Chiayi_3.8K_1957" data-server="chiayi">1957年 嘉義縣街道圖</option>
                        <option value="Chiayi_100K_1959" data-server="chiayi">1959年 嘉義縣圖</option>
                        <option value="Chiayi_10K_1976" data-server="chiayi">1976年 嘉義市一萬分一城市圖</option>
                        <option value="Chiayi_6K_1979" data-server="chiayi">1979年 嘉義市街圖</option>
                        <option value="chiayi_1982" data-server="chiayi">1982年 嘉義市行政區域圖</option>
                    </optgroup>
                `;
                L.DomEvent.on(select, 'change', () => changeHistoricalMap(select));

                const searchRow = L.DomUtil.create('div', 'flex gap-2', contentWrapper);
                const input = L.DomUtil.create('input', 'flex-1 px-4 py-2 border border-gray-300 rounded-lg', searchRow);
                input.placeholder = '輸入地址或地標 (例: 嘉義火車站)';
                const button = L.DomUtil.create('button', 'bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium', searchRow);
                button.innerHTML = '穿越';
                L.DomEvent.on(button, 'click', () => searchAddress(input));
                L.DomEvent.on(input, 'keypress', (e) => {
                    if (e.key === 'Enter') searchAddress(input);
                });

                const attribution = L.DomUtil.create('p', 'attribution', contentWrapper);
                attribution.innerHTML = '左側：歷史地圖 | 右側：現代地圖<br>(拖曳中間拉桿進行比對)';

                // 綁定收合/展開事件
                L.DomEvent.on(header, 'click', () => {
                    if (contentWrapper.style.display === 'none') {
                        contentWrapper.style.display = 'flex';
                        toggleBtn.innerHTML = '−';
                        container.style.width = '320px';
                    } else {
                        contentWrapper.style.display = 'none';
                        toggleBtn.innerHTML = '+';
                        container.style.width = 'auto'; 
                    }
                });

                return container;
            }
        });

        map.addControl(new L.Control.CustomHistory({ position: 'bottomright' }));
    </script>
</body>
</html>
