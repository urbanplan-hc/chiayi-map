<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣百年時空地圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 【修正點】改用相容性最完美的 Leaflet 1.7.1 版 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; }
        #ui-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 500px; }
        /* 稍微加粗拉桿線條，讓使用者更好點擊拖曳 */
        .leaflet-sbs-divider { width: 4px !important; background-color: #fff !important; }
    </style>
</head>
<body>

    <!-- 浮動控制面板 -->
    <div id="ui-container" class="bg-white/95 backdrop-blur-sm p-5 rounded-xl shadow-lg border border-gray-200">
        <h1 class="text-xl font-bold text-gray-800 mb-4 text-center">🕰️ 台灣百年時空地圖</h1>
        
        <!-- 歷史地圖切換選單 -->
        <div class="mb-3">
            <label for="map-select" class="block text-sm font-medium text-gray-700 mb-1">切換歷史地圖 (左側)：</label>
            <select id="map-select" onchange="changeHistoricalMap()" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-800 cursor-pointer">
                
                <optgroup label="全台灣">
                    <option value="JM20K_1904" data-server="tileserver">1904年 日治台灣堡圖</option>
                    <option value="AM50K_1944" data-server="tileserver">1944年 美軍地形圖</option>
                </optgroup>
                
                <optgroup label="嘉義專屬特輯">
                    <option value="Chiayi_3K_1910s" data-server="chiayi">1910年代 嘉義市街平面圖</option>
                    <option value="chiayi_1935" data-server="chiayi">1935年 嘉義市街圖</option>
                    <option value="chiayi_1943" data-server="chiayi">1943年 嘉義都市計畫平面圖</option>
                    <option value="Chiayi_aerialphoto_1945" data-server="chiayi">1945年 嘉義市舊航照空拍影像</option>
                </optgroup>
            </select>
        </div>

        <!-- 搜尋地址 -->
        <div class="flex gap-2">
            <input type="text" id="address-input" placeholder="輸入地址或地標 (例: 嘉義火車站)" 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="searchAddress()" 
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium whitespace-nowrap">
                穿越
            </button>
        </div>
        <p class="text-xs text-gray-500 mt-3 text-center">左側：歷史地圖 ｜ 右側：現代地圖<br>拖曳中間拉桿進行比對</p>
    </div>

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- 【修正點】改用相容性最完美的 Leaflet 1.7.1 版 JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side/leaflet-side-by-side.min.js"></script>

    <script>
        // 初始化地圖，預設中心點嘉義車站
        const map = L.map('map').setView([23.4791, 120.4415], 14);

        // 加入現代地圖 (右側)
        const modernMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 初始化加入第一張歷史地圖 (左側)
        const historicalMap = L.tileLayer('https://gis.sinica.edu.tw/tileserver/file-exists.php?img=JM20K_1904-png-{z}-{x}-{y}', {
            maxZoom: 19,
            attribution: '© 中央研究院人社中心GIS專題中心'
        }).addTo(map);

        // 啟用拉桿
        L.control.sideBySide(historicalMap, modernMap).addTo(map);

        // 動態切換圖層 API
        function changeHistoricalMap() {
            const select = document.getElementById('map-select');
            const selectedOption = select.options[select.selectedIndex];
            
            const layerId = selectedOption.value;
            const serverType = selectedOption.getAttribute('data-server'); 
            
            const newUrl = `https://gis.sinica.edu.tw/${serverType}/file-exists.php?img=${layerId}-png-{z}-{x}-{y}`;
            historicalMap.setUrl(newUrl);
        }

        // 搜尋功能
        let currentMarker = null;

        async function searchAddress() {
            const address = document.getElementById('address-input').value;
            if (!address) return;

            const query = `台灣 ${address}`;
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    
                    map.flyTo([lat, lon], 16, { duration: 1.5 });

                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }
                    
                    const select = document.getElementById('map-select');
                    const yearText = select.options[select.selectedIndex].text.substring(0, 5);

                    currentMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${address}</b><br>看看這裡 ${yearText} 是長什麼樣子！`)
                        .openPopup();
                } else {
                    alert('找不到這個地址，請換個關鍵字試試看！');
                }
            } catch (error) {
                alert('搜尋發生錯誤，請稍後再試。');
            }
        }

        document.getElementById('address-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAddress();
            }
        });
    </script>
</body>
</html>
