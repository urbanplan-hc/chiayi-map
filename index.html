<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉義古今地圖穿越</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; }
        
        /* 避免拉桿擋住控制面板 */
        .leaflet-sbs-range { z-index: 400 !important; }
        .leaflet-sbs-divider { z-index: 401 !important; }
        .leaflet-control-container .leaflet-bottom.leaflet-right { z-index: 9999 !important; }

        .leaflet-custom-history-control {
            margin-right: 10px;
            margin-bottom: 20px;
            pointer-events: auto; 
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(229, 231, 235, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 320px; 
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .leaflet-custom-history-control select, 
        .leaflet-custom-history-control input {
            font-size: 0.9rem;
            width: 100%;
        }

        .leaflet-custom-history-control .attribution {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side/leaflet-side-by-side.min.js"></script>

    <script>
        // 初始化地圖，預設中心點為嘉義車站
        const map = L.map('map').setView([23.4791, 120.4415], 14);

        // 加入現代地圖 (右側)
        const modernMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 【修正 1】正確對接 tileserver，並使用 jpg 格式載入 1904 台灣堡圖
        const initialLayerId = 'JM20K_1904';
        const historicalUrl = `https://gis.sinica.edu.tw/tileserver/file-exists.php?img=${initialLayerId}-jpg-{z}-{x}-{y}`;
        
        const historicalMap = L.tileLayer(historicalUrl, {
            maxZoom: 19,
            maxNativeZoom: 16, // 【關鍵】超過 16 級時自動放大圖磚，避免地圖放大後消失
            attribution: '© 中央研究院人社中心GIS專題中心'
        }).addTo(map);

        // 啟用拉桿 
        L.control.sideBySide(historicalMap, modernMap).addTo(map);

        // 【修正 2】動態切換圖層 API，正確套用 ${ext} 變數
        function changeHistoricalMap(selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const layerId = selectedOption.value;
            const serverType = selectedOption.getAttribute('data-server'); 
            const ext = selectedOption.getAttribute('data-ext') || 'png'; // 動態取得副檔名
            
            // 完美組合出正確的 API 網址，不再寫死 png
            const newUrl = `https://gis.sinica.edu.tw/${serverType}/file-exists.php?img=${layerId}-${ext}-{z}-{x}-{y}`;
            historicalMap.setUrl(newUrl);
        }

        // 搜尋功能 (開源地圖搜尋，限制台灣範圍)
        let currentMarker = null;
        async function searchAddress(addressInput) {
            const address = addressInput.value;
            if (!address) return;

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=tw&limit=1`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    
                    map.flyTo([lat, lon], 16, { duration: 1.5 });

                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }
                    
                    currentMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${address}</b><br>穿越到這裡！`)
                        .openPopup();
                } else {
                    alert('找不到這個地址，請嘗試輸入更完整的路名或知名地標！');
                }
            } catch (error) {
                alert('搜尋發生錯誤，請稍後再試。');
                console.error(error);
            }
        }

        L.Control.CustomHistory = L.Control.extend({
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-custom-history-control');
                L.DomEvent.disableClickPropagation(container);

                const header = L.DomUtil.create('div', 'flex justify-between items-center cursor-pointer', container);
                
                const titleContainer = L.DomUtil.create('div', 'flex items-center gap-2', header);
                const icon = L.DomUtil.create('span', '', titleContainer);
                icon.innerHTML = '🕰️';
                
                const title = L.DomUtil.create('h1', 'text-[1.1rem] font-bold text-gray-800 m-0', titleContainer);
                title.innerHTML = '嘉義古今地圖穿越';

                const toggleBtn = L.DomUtil.create('button', 'text-gray-500 hover:text-gray-800 focus:outline-none text-2xl leading-none font-medium', header);
                toggleBtn.innerHTML = '−';

                const contentWrapper = L.DomUtil.create('div', 'flex flex-col gap-3 mt-4', container);

                const select = L.DomUtil.create('select', 'w-full px-3 py-2 border border-gray-300 rounded-lg cursor-pointer', contentWrapper);
                
                // 【修正 3】為全台灣地圖指定正確的伺服器 (tileserver) 與格式 (data-ext)
                select.innerHTML = `
                    <optgroup label="全台灣">
                        <option value="JM20K_1904" data-server="tileserver" data-ext="jpg" selected>1904年 臺灣堡圖</option>
                        <option value="JM50K_1916" data-server="tileserver" data-ext="jpg">1916年 日治五萬分之一地形圖</option>
                        <option value="JM25K_1921" data-server="tileserver" data-ext="png">1921年 日治二萬五千分之一地形圖</option>
                        <option value="AM50K_1944" data-server="tileserver" data-ext="png">1944年 美軍臺灣地形圖</option>
                        <option value="TM25K_1989" data-server="tileserver" data-ext="png">1989年 經建版地形圖</option>
                        <option value="TM25K_2003" data-server="tileserver" data-ext="png">2003年 經建版地形圖</option>
                    </optgroup>
                    <optgroup label="嘉義專屬特輯">
                        <option value="chiayi_1895" data-server="chiayi" data-ext="png">1895年 嘉義之戰鬥圖</option>
                        <option value="Chiayi_0.6K_1906A" data-server="chiayi" data-ext="png">1906年 嘉義城內圖</option>
                        <option value="Chiayi_0.6K_1906B" data-server="chiayi" data-ext="png">1906年 嘉義城外圖</option>
                        <option value="chiayi_1909" data-server="chiayi" data-ext="png">1909年 嘉義市區改正圖</option>
                        <option value="Chiayi_3K_1910s" data-server="chiayi" data-ext="png">1910年代 嘉義市街平面圖</option>
                        <option value="Chiayi_3K_1913" data-server="chiayi" data-ext="png">1913年 嘉義市街圖</option>
                        <option value="chiayi_1931" data-server="chiayi" data-ext="png">1931年 嘉義市街實測圖</option>
                        <option value="chiayi_1932" data-server="chiayi" data-ext="png">1932年 嘉義市區計畫平面圖</option>
                        <option value="Chiayi_6K_1933" data-server="chiayi" data-ext="png">1933年 嘉義市區計畫平面圖</option>
                        <option value="chiayi_1935" data-server="chiayi" data-ext="png">1935年 嘉義市街圖</option>
                        <option value="chiayi_1936" data-server="chiayi" data-ext="png">1936年 嘉義市職業別明細圖</option>
                        <option value="Chiayi_6K_1938" data-server="chiayi" data-ext="png">1938年 嘉義都市計劃平面圖</option>
                        <option value="chiayi_12K_1940" data-server="chiayi" data-ext="png">1940年 嘉義市內地圖</option>
                        <option value="chiayi_1943" data-server="chiayi" data-ext="png">1943年 嘉義都市計畫平面圖</option>
                        <option value="AMCityPlan_1945" data-server="chiayi" data-ext="png">1945年 美軍繪製臺灣城市地圖</option>
                        <option value="Chiayi_aerialphoto_1945" data-server="chiayi" data-ext="png">1945年 嘉義市舊航照空拍影像</option>
                        <option value="Chiayi_3.8K_1957" data-server="chiayi" data-ext="png">1957年 嘉義縣街道圖</option>
                        <option value="Chiayi_100K_1959" data-server="chiayi" data-ext="png">1959年 嘉義縣圖</option>
                        <option value="Chiayi_10K_1976" data-server="chiayi" data-ext="png">1976年 嘉義市一萬分一城市圖</option>
                        <option value="Chiayi_6K_1979" data-server="chiayi" data-ext="png">1979年 嘉義市街圖</option>
                        <option value="chiayi_1982" data-server="chiayi" data-ext="png">1982年 嘉義市行政區域圖</option>
                    </optgroup>
                `;
                L.DomEvent.on(select, 'change', () => changeHistoricalMap(select));

                const searchRow = L.DomUtil.create('div', 'flex gap-2', contentWrapper);
                const input = L.DomUtil.create('input', 'flex-1 px-4 py-2 border border-gray-300 rounded-lg', searchRow);
                input.placeholder = '輸入地址或地標 (例: 嘉義火車站)';
                const button = L.DomUtil.create('button', 'bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium', searchRow);
                button.innerHTML = '穿越';
                L.DomEvent.on(button, 'click', () => searchAddress(input));
                L.DomEvent.on(input, 'keypress', (e) => {
                    if (e.key === 'Enter') searchAddress(input);
                });

                const attribution = L.DomUtil.create('p', 'attribution', contentWrapper);
                attribution.innerHTML = '左側：歷史地圖 | 右側：現代地圖<br>(拖曳中間拉桿進行比對)';

                L.DomEvent.on(header, 'click', () => {
                    if (contentWrapper.style.display === 'none') {
                        contentWrapper.style.display = 'flex';
                        toggleBtn.innerHTML = '−';
                        container.style.width = '320px';
                    } else {
                        contentWrapper.style.display = 'none';
                        toggleBtn.innerHTML = '+';
                        container.style.width = 'auto'; 
                    }
                });

                return container;
            }
        });

        map.addControl(new L.Control.CustomHistory({ position: 'bottomright' }));
    </script>
</body>
</html>
