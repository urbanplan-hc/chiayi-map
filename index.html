<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉義古今地圖穿越</title>
    
    <!-- 網頁預覽圖與摘要設定 (Open Graph) -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="嘉義古今地圖穿越">
    <meta property="og:description" content="在地圖上滑動拉桿，一秒穿越嘉義百年時空。比對百年前的地籍圖與美軍航照，探索歷史軌跡。">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="嘉義古今地圖穿越">
    <meta name="twitter:description" content="在地圖上滑動拉桿，一秒穿越嘉義百年時空。">
    <meta name="twitter:image" content="https://urbanplan-hc.github.io/chiayi-map/home.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; }
        
        .leaflet-sbs-range { z-index: 400 !important; }
        .leaflet-sbs-divider { z-index: 401 !important; }
        .leaflet-control-container .leaflet-bottom.leaflet-right { z-index: 9999 !important; }

        .leaflet-custom-history-control {
            margin-right: 10px;
            margin-bottom: 20px;
            pointer-events: auto; 
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(229, 231, 235, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 340px; 
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .leaflet-custom-history-control select, 
        .leaflet-custom-history-control input {
            font-size: 0.9rem;
            width: 100%;
        }

        .leaflet-custom-history-control .attribution {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side/leaflet-side-by-side.min.js"></script>

    <script>
        const map = L.map('map').setView([23.4791, 120.4415], 14);

        const modernMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const initialLayerId = 'JM20K_1904';
        const historicalUrl = `https://gis.sinica.edu.tw/tileserver/file-exists.php?img=${initialLayerId}-jpg-{z}-{x}-{y}`;
        
        const historicalMap = L.tileLayer(historicalUrl, {
            maxZoom: 19,
            maxNativeZoom: 15,
            attribution: '© 中央研究院人社中心GIS專題中心'
        }).addTo(map);

        // 防破圖切換：如果載入圖磚失敗，自動切換 jpg/png 格式重試一次
        historicalMap.on('tileerror', function(e) {
            if (e.tile && !e.tile.fallbackAttempted) {
                e.tile.fallbackAttempted = true; 
                const currentSrc = e.tile.src;
                
                if (currentSrc.includes('-png-')) {
                    e.tile.src = currentSrc.replace('-png-', '-jpg-');
                } else if (currentSrc.includes('-jpg-')) {
                    e.tile.src = currentSrc.replace('-jpg-', '-png-');
                } 
            }
        });

        L.control.sideBySide(historicalMap, modernMap).addTo(map);

        // 統一下達標準請求
        function changeHistoricalMap(selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const layerId = selectedOption.value;
            const serverType = selectedOption.getAttribute('data-server'); 
            const ext = selectedOption.getAttribute('data-ext') || 'png';
            
            const newUrl = `https://gis.sinica.edu.tw/${serverType}/file-exists.php?img=${layerId}-${ext}-{z}-{x}-{y}`;
            historicalMap.setUrl(newUrl);
        }

        let currentMarker = null;
        async function searchAddress(addressInput) {
            const address = addressInput.value.trim();
            if (!address) return;

            let queries = [];
            queries.push(`台灣 ${address}`);
            queries.push(address);

            const streetMatch = address.match(/^(.*?[路街大道段])/);
            if (address.includes('號') && streetMatch) {
                queries.push(`台灣 ${streetMatch[1]}`);
                queries.push(streetMatch[1]);
            }

            let foundData = null;
            for (let query of queries) {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=tw&accept-language=zh-TW&limit=1`;
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        foundData = data[0];
                        break; 
                    }
                } catch (error) {
                    console.error('OSM 搜尋發生錯誤:', error);
                }
            }

            if (foundData) {
                const lat = parseFloat(foundData.lat);
                const lon = parseFloat(foundData.lon);
                
                map.flyTo([lat, lon], 16, { duration: 1.5 });

                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }
                
                currentMarker = L.marker([lat, lon]).addTo(map)
                    .bindPopup(`<b>${address}</b><br>穿越到這裡！`)
                    .openPopup();
            } else {
                alert('開源地圖庫找不到這個精確地址！\n建議：嘗試輸入知名地標，或只輸入「縣市+路名」（例如將「中山路160號」改為「嘉義市中山路」）。');
            }
        }

        L.Control.CustomHistory = L.Control.extend({
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-custom-history-control');
                L.DomEvent.disableClickPropagation(container);

                const header = L.DomUtil.create('div', 'flex justify-between items-center cursor-pointer', container);
                
                const titleContainer = L.DomUtil.create('div', 'flex items-center gap-2', header);
                const icon = L.DomUtil.create('span', '', titleContainer);
                icon.innerHTML = '🕰️';
                
                const title = L.DomUtil.create('h1', 'text-[1.1rem] font-bold text-gray-800 m-0', titleContainer);
                title.innerHTML = '嘉義古今地圖穿越';

                const toggleBtn = L.DomUtil.create('button', 'text-gray-500 hover:text-gray-800 focus:outline-none text-2xl leading-none font-medium', header);
                toggleBtn.innerHTML = '−';

                const contentWrapper = L.DomUtil.create('div', 'flex flex-col gap-3 mt-4', container);

                const select = L.DomUtil.create('select', 'w-full px-3 py-2 border border-gray-300 rounded-lg cursor-pointer', contentWrapper);
                
                // 【終極修正：將 1944與經建版的伺服器全數指回標準的 tileserver】
                select.innerHTML = `
                   <optgroup label="全台灣">
                        <option value="JM20K_1904" data-server="tileserver" data-ext="jpg" selected>1904-日治臺灣堡圖(明治版)</option>
                        <option value="JM25K_1921" data-server="tileserver" data-ext="png">1921-日治二萬五千分之一地形圖</option>
                        <option value="AM50K_1944" data-server="tileserver" data-ext="jpg">1944-美軍臺灣地形圖</option>
                        <option value="TM25K_1989" data-server="chiayi" data-ext="jpg">1989-臺灣經建1版地形圖</option>
                        <option value="TM25K_2001" data-server="chiayi" data-ext="jpg">2001-臺灣經建3版地形圖</option>
                    </optgroup>
                    <optgroup label="嘉義專屬特輯">
                        <option value="chiayi_1895" data-server="chiayi" data-ext="png">嘉義之戰鬥圖(1895)</option>
                        <option value="Chiayi_0.6K_1906A" data-server="chiayi" data-ext="png">嘉義城內圖(1906)</option>
                        <option value="Chiayi_0.6K_1906B" data-server="chiayi" data-ext="png">嘉義城外圖(1906)</option>
                        <option value="chiayi_1909" data-server="chiayi" data-ext="png">嘉義市區改正圖(1909)</option>
                        <option value="Chiayi_3K_1910s" data-server="chiayi" data-ext="png">嘉義市街平面圖(1910年代)</option>
                        <option value="Chiayi_3K_1913" data-server="chiayi" data-ext="png">嘉義市街圖(1913)</option>
                        <option value="chiayi_1931" data-server="chiayi" data-ext="png">嘉義市街實測圖(1931)</option>
                        <option value="chiayi_1932" data-server="chiayi" data-ext="png">嘉義市區計畫平面圖(1932)</option>
                        <option value="Chiayi_6K_1933" data-server="chiayi" data-ext="png">嘉義市區計畫平面圖(1933)</option>
                        <option value="chiayi_1935" data-server="chiayi" data-ext="png">嘉義市街圖(1935)</option>
                        <option value="chiayi_1936" data-server="chiayi" data-ext="png">嘉義市職業別明細圖(1936)</option>
                        <option value="Chiayi_6K_1938" data-server="chiayi" data-ext="png">嘉義都市計劃平面圖(1938)</option>
                        <option value="chiayi_12K_1940" data-server="chiayi" data-ext="png">嘉義市內地圖(1940)</option>
                        <option value="Chiayi_Minsyong_2.5K_1941" data-server="chiayi" data-ext="png">嘉義民雄地方(調查)平面圖(1941)</option>
                        <option value="chiayi_1943" data-server="chiayi" data-ext="png">嘉義都市計畫平面圖(1943)</option>
                        <option value="AMCityPlan_1945" data-server="chiayi" data-ext="png">1945-美軍繪製臺灣城市地圖</option>
                        <option value="Chiayi_aerialphoto_1945" data-server="chiayi" data-ext="png">嘉義市舊航照影像(1945)</option>
                        <option value="Chiayi_3.8K_1957" data-server="chiayi" data-ext="png">嘉義縣街道圖(1957)</option>
                        <option value="Chiayi_100K_1959" data-server="chiayi" data-ext="png">嘉義縣圖(1959)</option>
                        <option value="Chiayi_3K_1970s_A" data-server="chiayi" data-ext="png">嘉義市都市計畫郊區細部計畫地形測量原圖</option>
                        <option value="Chiayi_3K_1970s_B" data-server="chiayi" data-ext="png">嘉義市都市計畫郊區細部計畫地形圖</option>
                        <option value="Chiayi_10K_1976" data-server="chiayi" data-ext="png">嘉義市一萬分一城市圖(1976)</option>
                        <option value="Chiayi_40K_1977" data-server="chiayi" data-ext="png">1977-嘉南大圳灌溉地給水區分圖_嘉義</option>
                        <option value="Chiayi_6K_1979" data-server="chiayi" data-ext="png">嘉義市街圖(1979)</option>
                        <option value="Chiayi_6K_1980" data-server="chiayi" data-ext="png">嘉義市明細圖(1980)</option>
                        <option value="Chiayi_6K_1980s" data-server="chiayi" data-ext="png">嘉義都市計劃平面圖(1980s)</option>
                        <option value="chiayi_1982" data-server="chiayi" data-ext="png">嘉義市行政區域圖(1982)</option>
                        <option value="Chiayi_15K_1983" data-server="chiayi" data-ext="png">嘉義市圖(1983)</option>
                        <option value="Chiayi_27.5K_1992" data-server="chiayi" data-ext="png">嘉義市圖(1992)</option>
                        <option value="Map_TFB3_Chiayi" data-server="chiayi" data-ext="png">日治國有林野圖(臺南州嘉義郡)</option>
                        <option value="map_wra_00160" data-server="chiayi" data-ext="png">大湖水庫地形圖</option>
                    </optgroup>
                    <optgroup label="嘉義地籍圖系列">
                        <option value="chaiyi_tj7a1787" data-server="chiayi" data-ext="png">嘉義郡竹崎庄竹崎圖</option>
                        <option value="chaiyi_tj7a1788" data-server="chiayi" data-ext="png">嘉義郡竹崎庄瓦厝埔圖</option>
                        <option value="chaiyi_tj7a1800" data-server="chiayi" data-ext="png">嘉義郡竹崎庄鹿麻產圖</option>
                        <option value="chaiyi_tj7a1805" data-server="chiayi" data-ext="png">嘉義市(街)北社尾圖</option>
                        <option value="chaiyi_tj7a1809" data-server="chiayi" data-ext="png">嘉義市(街)埤子頭圖</option>
                        <option value="chaiyi_tj7a1810" data-server="chiayi" data-ext="png">嘉義市(街)盧厝圖</option>
                        <option value="chaiyi_tj7a1812" data-server="chiayi" data-ext="png">嘉義市(街)竹子腳圖</option>
                        <option value="chaiyi_tj7a1813" data-server="chiayi" data-ext="png">嘉義市(街)臺斗坑圖</option>
                        <option value="chaiyi_tj7a1820" data-server="chiayi" data-ext="png">嘉義市(街)竹圍子圖</option>
                        <option value="chaiyi_tj7a1821" data-server="chiayi" data-ext="png">嘉義郡竹崎庄內埔子圖</option>
                        <option value="chaiyi_tj7a1827" data-server="chiayi" data-ext="png">嘉義市(街)大溪厝圖</option>
                        <option value="chaiyi_tj7a1828" data-server="chiayi" data-ext="png">嘉義郡番路庄內甕圖</option>
                        <option value="chaiyi_tj7a1830" data-server="chiayi" data-ext="png">嘉義郡番路庄下坑圖</option>
                        <option value="chaiyi_tj7a1836a" data-server="chiayi" data-ext="png">嘉義市(街)新高町、檜木町與山下町</option>
                        <option value="chaiyi_tj7a1836b" data-server="chiayi" data-ext="png">嘉義市(街)白川町、玉川町圖</option>
                        <option value="chaiyi_tj7a1844" data-server="chiayi" data-ext="png">嘉義市(街)柴頭港圖</option>
                        <option value="chaiyi_tj7a1846" data-server="chiayi" data-ext="png">嘉義市(街)港子坪圖</option>
                        <option value="chaiyi_tj7a1852" data-server="chiayi" data-ext="png">嘉義市(街)車店圖</option>
                        <option value="chaiyi_tj7a1856" data-server="chiayi" data-ext="png">嘉義市(街)劉厝圖</option>
                        <option value="chaiyi_tj7a1866" data-server="chiayi" data-ext="png">嘉義郡中埔庄社口圖</option>
                        <option value="chaiyi_tj7a1870" data-server="chiayi" data-ext="png">嘉義郡中埔庄下六圖</option>
                        <option value="chaiyi_tj7a1872" data-server="chiayi" data-ext="png">嘉義郡水上庄湖子內圖</option>
                        <option value="chaiyi_tj7a1881" data-server="chiayi" data-ext="png">嘉義郡中埔庄頂六圖</option>
                        <option value="chaiyi_tj7a1882" data-server="chiayi" data-ext="png">嘉義郡中埔庄樹頭埔圖</option>
                        <option value="chaiyi_tj7a1883" data-server="chiayi" data-ext="png">嘉義郡水上庄巷口圖</option>
                        <option value="chaiyi_tj7a1884" data-server="chiayi" data-ext="png">嘉義郡水上庄大堀尾圖</option>
                        <option value="chaiyi_tj7a1891" data-server="chiayi" data-ext="png">嘉義郡水上庄粗溪圖</option>
                        <option value="chaiyi_tj7a1896" data-server="chiayi" data-ext="png">嘉義郡中埔庄枋樹腳圖</option>
                        <option value="chaiyi_tj7a1897" data-server="chiayi" data-ext="png">嘉義郡水上庄三界埔圖</option>
                        <option value="chaiyi_tj7a1900" data-server="chiayi" data-ext="png">嘉義郡中埔庄石頭厝圖</option>
                        <option value="chaiyi_tj7a1901" data-server="chiayi" data-ext="png">嘉義郡中埔庄鹽館圖</option>
                        <option value="chaiyi_tj7a1904" data-server="chiayi" data-ext="png">嘉義郡水上庄十一指厝圖</option>
                        <option value="chaiyi_tj7a1911" data-server="chiayi" data-ext="png">嘉義郡中埔庄龍山腳圖</option>
                        <option value="chaiyi_tj7a1924" data-server="chiayi" data-ext="png">嘉義郡中埔庄白芒埔圖</option>
                        <option value="chaiyi_tj7a1934" data-server="chiayi" data-ext="png">嘉義郡中埔庄深坑圖</option>
                        <option value="chaiyi_tj7a1941" data-server="chiayi" data-ext="png">嘉義郡中埔庄竹頭崎圖</option>
                    </optgroup>
                `;
                L.DomEvent.on(select, 'change', () => changeHistoricalMap(select));

                const searchRow = L.DomUtil.create('div', 'flex gap-2', contentWrapper);
                const input = L.DomUtil.create('input', 'flex-1 px-4 py-2 border border-gray-300 rounded-lg', searchRow);
                input.placeholder = '輸入地址或地標 (例: 嘉義火車站)';
                const button = L.DomUtil.create('button', 'bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium', searchRow);
                button.innerHTML = '穿越';
                L.DomEvent.on(button, 'click', () => searchAddress(input));
                L.DomEvent.on(input, 'keypress', (e) => {
                    if (e.key === 'Enter') searchAddress(input);
                });

                const attribution = L.DomUtil.create('p', 'attribution', contentWrapper);
                attribution.innerHTML = '左側：歷史地圖 | 右側：現代地圖<br>(拖曳中間拉桿進行比對)';

                L.DomEvent.on(header, 'click', () => {
                    if (contentWrapper.style.display === 'none') {
                        contentWrapper.style.display = 'flex';
                        toggleBtn.innerHTML = '−';
                        container.style.width = '340px';
                    } else {
                        contentWrapper.style.display = 'none';
                        toggleBtn.innerHTML = '+';
                        container.style.width = 'auto'; 
                    }
                });

                return container;
            }
        });

        map.addControl(new L.Control.CustomHistory({ position: 'bottomright' }));
    </script>
</body>
</html>
